<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Vendedores')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>
    
    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-people"></i> Vendedores registrados</h2>
        </div>
        
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="user : ${usuarios}">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" 
                                 style="width: 60px; height: 60px; font-size: 1.5rem;">
                                <span th:text="${#strings.substring(user.nombre, 0, 1)}">U</span>
                            </div>
                            <div>
                                <h5 class="card-title mb-1" th:text="${user.nombre}">Nombre</h5>
                                <span class="badge bg-info" th:text="${user.tipo}">USUARIO</span>
                            </div>
                        </div>
                        
                        <ul class="list-unstyled text-muted mb-3">
                            <li><i class="bi bi-envelope"></i> <span th:text="${user.email}">email</span></li>
                            <li><i class="bi bi-telephone"></i> <span th:text="${user.telefono}">tel</span></li>
                            <li><i class="bi bi-box"></i> <span th:text="${#lists.size(user.dispositivosPublicados)}">0</span> productos</li>
                        </ul>
                        
                        <div class="d-grid gap-2">
                            <a th:href="@{/usuarios/perfil/{id}(id=${user.id})}" class="btn btn-outline-primary">
                                <i class="bi bi-eye"></i> Ver perfil
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="d-flex justify-content-center align-items-center mt-5" th:if="${totalPages > 1}">
            
            <a th:if="${currentPage > 0}" 
            th:href="@{/usuarios(page=${currentPage - 1})}" 
            class="btn btn-primary me-3">
            <i class="bi bi-chevron-left"></i> Anterior
            </a>

            <span class="text-muted fw-bold">
                Página <span th:text="${currentPage + 1}"></span> de <span th:text="${totalPages}"></span>
            </span>

            <a th:if="${currentPage < totalPages - 1}" 
            th:href="@{/usuarios(page=${currentPage + 1})}" 
            class="btn btn-primary ms-3">
            Siguiente <i class="bi bi-chevron-right"></i>
            </a>
            
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
