<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${esAdmin != null and esAdmin} ? 'Crear Administrador - Panel' : 'Registro - EcoAssets')}">
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card product-card">
                    <div class="card-body p-5">
                        
                        <h2 class="text-center mb-4 fw-bold" style="color: var(--primary-color);"
                            th:text="${esAdmin != null and esAdmin} ? 'Crear Administrador' : 'Crear una cuenta nueva'">
                        </h2>
                        
                        <form th:action="${rutaDestino != null ? rutaDestino : '/registro'}" th:object="${usuario}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre Completo:</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Juan Pérez" required />
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo Electrónico (Email):</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="tucorreo@ejemplo.com" required />
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Contraseña:</label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Mínimo 6 caracteres" required />
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Numero de Celular:</label>
                                <input type="tel" th:field="*{telefono}" class="form-control" placeholder="ej: 3008577986" required />
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn text-white fw-bold" style="background-color: var(--primary-color);"
                                        th:text="${esAdmin != null and esAdmin} ? 'Guardar Administrador' : 'Registrarme'">
                                </button>
                                
                                <a th:if="${esAdmin != null and esAdmin}" th:href="@{/admin/panel}" class="btn btn-secondary fw-bold mt-2">
                                    Cancelar y Volver
                                </a>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4" th:unless="${esAdmin != null and esAdmin}">
                            <a th:href="@{/login}" class="text-decoration-none" style="color: var(--primary-color);">
                                ¿Ya tienes una cuenta? Inicia sesión aquí
                            </a>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
