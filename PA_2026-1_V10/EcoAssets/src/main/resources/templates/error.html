<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Ups! Ha ocurrido un error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-card {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            border-top: 5px solid #dc3545;
        }
        h1 {
            color: #dc3545;
            margin-top: 0;
        }
        .status-code {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <h1>Algo salió mal</h1>
        
        <div class="status-code">
            Error <span th:text="${status}">000</span>
        </div>
        
        <h3 th:text="${error}">Tipo de Error</h3>
        
        <p th:text="${message}">Detalle de lo que provocó el error.</p>
        
        <a th:href="@{/dispositivos}" class="btn">Volver a la tienda</a>
    </div>

</body>
</html>
