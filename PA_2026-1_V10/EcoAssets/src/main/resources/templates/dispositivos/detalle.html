<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Detalle del Producto')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>
    
    <div class="container mt-5 mb-5">
        <div class="row">
            <div class="col-md-6 text-center">
                <img th:src="${dispositivo.imagenUrl != null and !dispositivo.imagenUrl.isEmpty()} ? ${dispositivo.imagenUrl} : '/img/default-device.png'" 
                     class="img-fluid rounded shadow-sm" alt="Imagen del dispositivo" style="max-height: 500px; object-fit: cover;">
            </div>
            
            <div class="col-md-6">
                <h2 class="fw-bold" th:text="${dispositivo.nombre}">Nombre del Dispositivo</h2>
                <h3 class="text-success fw-bold mb-3" th:text="'$ ' + ${#numbers.formatDecimal(dispositivo.precio, 0, 'COMMA', 0, 'POINT')}">Precio</h3>
                
                <div class="mb-3">
                    <span class="badge bg-primary me-2" th:text="${dispositivo.categoria}">Categoría</span>
                    <span class="badge bg-secondary" th:text="${dispositivo.estado}">Estado</span>
                </div>

                <p><strong>Marca:</strong> <span th:text="${dispositivo.marca}"></span></p>
                <p><strong>Modelo:</strong> <span th:text="${dispositivo.modelo}"></span></p>
                <p><strong>Ubicación:</strong> <span th:text="${dispositivo.municipio} + ', ' + ${dispositivo.departamento}"></span></p>
                
                <h5 class="mt-4 border-bottom pb-2">Descripción</h5>
                <p th:text="${dispositivo.descripcion}">Descripción completa del dispositivo...</p>
                
                <div class="card mt-4 bg-light border-0 shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0 text-muted">Vendido por:</h6>
                            <strong th:text="${dispositivo.vendedor.nombre}">Nombre Vendedor</strong>
                        </div>
                        <a th:href="@{/usuarios/perfil/{id}(id=${dispositivo.vendedor.id})}" class="btn btn-outline-info btn-sm">
                            Ver perfil del vendedor</a>
                    </div>
                </div>
                
                <div class="mt-4 d-flex gap-3" 
     th:if="${dispositivo.vendedor == null or #authentication.name != dispositivo.vendedor.email}">
    
    <form th:action="@{/carrito/agregar}" method="post" class="flex-grow-1">
        <input type="hidden" name="dispositivoId" th:value="${dispositivo.id}">
        <button type="submit" class="btn btn-warning w-100 btn-lg shadow-sm">
            Agregar al carrito
        </button>
    </form>
    
    <form th:action="@{/compra/rapida}" method="post" class="flex-grow-1">
    <input type="hidden" name="dispositivoId" th:value="${dispositivo.id}">
    <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm fw-bold">
        Comprar ahora <i class="bi bi-lightning-fill"></i>
    </button>
</form>
</div>

<div class="alert alert-info mt-4" 
     th:if="${dispositivo.vendedor != null and #authentication.name == dispositivo.vendedor.email}">
    <i class="bi bi-info-circle"></i> Este es tu producto publicado. Puedes editarlo o eliminarlo desde tu perfil.
</div>
                
                <!-- Botón EDITAR: solo el dueño -->
                <div class="mt-4 d-flex gap-3">
                    <a th:href="@{/dispositivos/editar/{id}(id=${dispositivo.id})}"
                    class="btn btn-outline-warning btn-sm"
                    sec:authorize="isAuthenticated()"
                    th:if="${dispositivo.vendedor != null and #authentication.name == dispositivo.vendedor.email}"
                    title="Editar producto">
                    <i class="bi bi-pencil"></i>
                    </a>


                    <!-- Botón eliminar: solo Admin o Dueño -->
                    <a th:href="@{/dispositivos/eliminar/{id}(id=${dispositivo.id})}" 
                       class="btn btn-outline-danger btn-sm"
                        sec:authorize="isAuthenticated()"
                        th:if="${#authorization.expression('hasRole(''ADMIN'')') or 
                            (dispositivo.vendedor != null and 
                            #authentication.name == dispositivo.vendedor.email)}"
                        onclick="return confirm('¿Eliminar este dispositivo?')">
                        <i class="bi bi-trash"></i>
                        </a>
                </div>

            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
