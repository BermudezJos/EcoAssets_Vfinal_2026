spring.application.name=electronicos
#server.port=8081

#----mongod----
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
#spring.data.mongodb.database=ecoasset_db

#spring.data.mongodb.uri=mongodb://localhost:27017/ecoasset_db

#--mongo atlas
spring.data.mongodb.host=${MONGODB_HOST}
spring.data.mongodb.database=$MONGODB_DATABASE}

spring.data.mongodb.uri=${MONGODB_URI}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML


# Encoding
spring.thymeleaf.encoding=UTF-8

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Clave secreta
app.jwt.secret=${JWT_SECRET}
# Tiempo de expiración en milisegundos para 48 horas
app.jwt.expiration=172800000

# GOOGLE OAUTH2 CONFIGURATION
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

spring.jmx.enabled=false


